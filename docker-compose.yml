version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: supermarkets-postgres
    environment:
      POSTGRES_USER: supermarkets
      POSTGRES_PASSWORD: supermarkets_dev
      POSTGRES_DB: supermarkets_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supermarkets"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis (opcional - para BullMQ em produção)
  redis:
    image: redis:7-alpine
    container_name: supermarkets-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles:
      - queue # Só inicia se usar: docker-compose --profile queue up

volumes:
  postgres_data:
  redis_data:

